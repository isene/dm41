[package]
name = "dm41"
version = "0.6.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "A twin of the SwissMicros DM41X in the terminal: programs, registers, flags and X-Memory from its state file"
license = "Unlicense"
repository = "https://github.com/isene/dm41"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
libc = "0.2"
orbit = { version = "0.2", path = "../orbit", package = "fe2o3-orbit" }
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = true
strip = true
